[project]
name = "talkie-pipeline"
version = "0.1.0"
description = "talkie 플러그인의 음성 합성, 검증, 조립 스크립트 의존성"
requires-python = ">=3.12,<3.13"
dependencies = [
    "supertonic==1.3.1",
    "numpy",
    "soundfile",
    "truststore",
    "jsonschema",
    "pillow",
    "playwright",
    "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv]
package = false
