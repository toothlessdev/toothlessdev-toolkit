<!-- talkie player: build_deck.py 가 이 파일을 그대로 삽입합니다. 덱마다 고치지 않습니다. -->
<style data-talkie-ui>
    :root {
        --talkie-accent: #0078ff;
        --talkie-ease: cubic-bezier(0.22, 0.8, 0.2, 1);
    }

    .talkie-ui,
    .talkie-ui * {
        box-sizing: border-box;
    }

    .talkie-ui {
        font-family: "SUIT Variable", "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
    }

    html[data-talkie-started] body > *:not(.talkie-ui):not(dialog) {
        cursor: default;
    }

    html[data-talkie-idle] body,
    html[data-talkie-idle] body * {
        cursor: none !important;
    }

    html[data-talkie-hide-ui] .talkie-ui {
        display: none !important;
    }

    .talkie-subtitle {
        position: fixed;
        left: 50%;
        bottom: calc(5vh + env(safe-area-inset-bottom, 0px));
        z-index: 2147483000;
        width: max-content;
        max-width: min(84vw, 1400px);
        padding: 0.5em 1em;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.74);
        color: #fff;
        font-size: clamp(15px, 2vw, 32px);
        font-weight: 600;
        line-height: 1.45;
        text-align: center;
        word-break: keep-all;
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, 0);
        transition:
            opacity 160ms ease,
            transform 220ms var(--talkie-ease);
    }

    .talkie-subtitle[data-visible] {
        opacity: 1;
    }

    html[data-talkie-controls] .talkie-subtitle {
        transform: translate(-50%, calc(-1 * var(--talkie-subtitle-lift, 64px)));
    }

    .talkie-bar {
        position: fixed;
        inset: auto 0 0;
        z-index: 2147483001;
        padding: 28px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
        /* 덱 하단의 푸터 글자가 컨트롤과 겹쳐 보이지 않게 컨트롤 줄까지는 거의 불투명하게 둡니다. */
        background: linear-gradient(to top, rgba(0, 0, 0, 0.94) 0, rgba(0, 0, 0, 0.9) 52px, rgba(0, 0, 0, 0) 100%);
        color: #fff;
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
        transition:
            opacity 180ms ease,
            transform 220ms var(--talkie-ease);
    }

    html[data-talkie-controls] .talkie-bar {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
    }

    .talkie-scrubber {
        position: relative;
        display: flex;
        align-items: center;
        gap: 2px;
        height: 20px;
        cursor: pointer;
        touch-action: none;
        outline: none;
    }

    .talkie-scrubber:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
        border-radius: 4px;
    }

    .talkie-chapter {
        position: relative;
        flex: var(--talkie-chapter-grow) 1 0;
        min-width: 1px;
        height: 3px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.28);
        transition: height 120ms ease;
    }

    .talkie-chapter i {
        position: absolute;
        inset: 0;
        background: var(--talkie-accent);
        transform: scaleX(var(--talkie-chapter-progress, 0));
        transform-origin: left;
    }

    .talkie-scrubber:hover .talkie-chapter,
    .talkie-scrubber[data-dragging] .talkie-chapter {
        height: 5px;
    }

    .talkie-thumb {
        position: absolute;
        top: 50%;
        left: 0;
        width: 13px;
        height: 13px;
        margin: -6.5px 0 0 -6.5px;
        border-radius: 50%;
        background: var(--talkie-accent);
        pointer-events: none;
        transform: scale(0);
        transition: transform 120ms var(--talkie-ease);
    }

    .talkie-scrubber:hover .talkie-thumb,
    .talkie-scrubber[data-dragging] .talkie-thumb,
    .talkie-scrubber:focus-visible .talkie-thumb {
        transform: scale(1);
    }

    .talkie-tooltip {
        position: absolute;
        bottom: 24px;
        left: 0;
        max-width: 280px;
        padding: 5px 9px;
        overflow: hidden;
        border-radius: 6px;
        background: rgba(20, 20, 20, 0.94);
        font-size: 12px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        text-overflow: ellipsis;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transform: translateX(-50%);
    }

    .talkie-tooltip[data-visible] {
        opacity: 1;
    }

    .talkie-row {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 40px;
    }

    .talkie-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 40px;
        height: 40px;
        padding: 0 8px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #fff;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        cursor: pointer;
        transition:
            background 120ms ease,
            transform 120ms ease;
    }

    .talkie-button:hover {
        background: rgba(255, 255, 255, 0.14);
    }

    .talkie-button:active {
        transform: scale(0.94);
    }

    .talkie-button:focus-visible {
        outline: 2px solid #fff;
        outline-offset: -2px;
    }

    .talkie-button svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
    }

    .talkie-button[aria-pressed="true"] {
        color: var(--talkie-accent);
    }

    .talkie-button[hidden] {
        display: none;
    }

    .talkie-time {
        padding: 0 8px;
        font-size: 13px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }

    .talkie-chapter-title {
        min-width: 0;
        overflow: hidden;
        color: rgba(255, 255, 255, 0.72);
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .talkie-spacer {
        flex: 1;
    }

    .talkie-rate {
        position: relative;
    }

    .talkie-rate-menu {
        position: absolute;
        right: 0;
        bottom: 46px;
        display: none;
        min-width: 88px;
        padding: 4px;
        border-radius: 10px;
        background: rgba(20, 20, 20, 0.96);
    }

    .talkie-rate-menu[data-open] {
        display: block;
    }

    .talkie-rate-menu .talkie-button {
        width: 100%;
        height: 34px;
    }

    .talkie-rate-menu .talkie-button[aria-checked="true"] {
        color: var(--talkie-accent);
    }

    .talkie-overlay {
        position: fixed;
        inset: 0;
        z-index: 2147483002;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 16px;
        background: rgba(6, 6, 8, 0.72);
        color: rgba(255, 255, 255, 0.82);
        text-align: center;
    }

    .talkie-overlay[hidden] {
        display: none;
    }

    .talkie-overlay button {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 16px 34px;
        border: 0;
        border-radius: 999px;
        background: var(--talkie-accent);
        color: #fff;
        font: inherit;
        font-size: 20px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 140ms var(--talkie-ease);
    }

    .talkie-overlay button:hover {
        transform: scale(1.03);
    }

    .talkie-overlay button:active {
        transform: scale(0.97);
    }

    .talkie-overlay button:disabled {
        opacity: 0.6;
        cursor: progress;
    }

    .talkie-overlay svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
    }

    .talkie-overlay p {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
    }

    .talkie-overlay kbd {
        font: inherit;
        font-weight: 700;
    }

    /* 터치에는 hover 가 없으므로 재생 위치 표시를 항상 보이고, 손가락이 닿는 영역을 넓힙니다. */
    @media (pointer: coarse) {
        .talkie-keyboard-hint {
            display: none;
        }

        .talkie-scrubber {
            height: 32px;
        }

        .talkie-chapter,
        .talkie-scrubber:hover .talkie-chapter {
            height: 4px;
        }

        .talkie-scrubber[data-dragging] .talkie-chapter {
            height: 6px;
        }

        .talkie-thumb {
            width: 16px;
            height: 16px;
            margin: -8px 0 0 -8px;
            transform: scale(1);
        }

        .talkie-tooltip {
            bottom: 34px;
            max-width: calc(100vw - 32px);
            font-size: 13px;
        }

        .talkie-row {
            height: 44px;
        }

        .talkie-button {
            min-width: 44px;
            height: 44px;
        }

        .talkie-rate-menu {
            bottom: 50px;
        }

        .talkie-rate-menu .talkie-button {
            height: 44px;
        }
    }

    /* 좁은 화면은 슬라이드 제목, 재생 위치, 버튼을 세 줄로 나눕니다. 한 줄에 모으면 제목이 잘려서 읽을 수 없습니다. */
    @media (max-width: 640px) {
        .talkie-bar {
            display: grid;
            grid-template-columns: auto auto minmax(0, 1fr) auto auto auto;
            padding-top: 24px;
            padding-right: max(10px, env(safe-area-inset-right, 0px));
            padding-left: max(10px, env(safe-area-inset-left, 0px));
            background: linear-gradient(to top, rgba(0, 0, 0, 0.94) 0, rgba(0, 0, 0, 0.9) 75%, rgba(0, 0, 0, 0) 100%);
        }

        .talkie-row {
            display: contents;
        }

        .talkie-chapter-title {
            grid-row: 1;
            grid-column: 1 / -1;
            padding-inline: 6px;
        }

        .talkie-scrubber {
            grid-row: 2;
            grid-column: 1 / -1;
            gap: 1px;
            margin-inline: 6px;
        }

        .talkie-time {
            align-self: center;
            padding-inline: 2px;
        }

        .talkie-subtitle {
            max-width: 92vw;
        }
    }

    /* 가로로 눕힌 휴대폰은 세로 공간이 좁아서 자막과 컨트롤을 줄여 덱을 가리는 면적을 줄입니다. */
    @media (max-height: 480px) {
        .talkie-bar {
            padding-top: 12px;
        }

        .talkie-subtitle {
            bottom: calc(8px + env(safe-area-inset-bottom, 0px));
            padding: 0.3em 0.8em;
            font-size: 14px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .talkie-ui,
        .talkie-ui * {
            transition: none !important;
        }
    }
</style>

<script data-talkie-ui>
    (() => {
        const data = window.__TALKIE_DATA__;
        const adapter = window.talkieAdapter;
        const { timeline } = data;

        const SEEK_STEP_SECONDS = 10;
        const CONTROLS_IDLE_MS = 2500;
        const DISCONTINUITY_SECONDS = 0.75;
        const SUBTITLE_LINGER_SECONDS = 0.3;
        const PLAYBACK_RATES = [0.75, 1, 1.25, 1.5, 2];

        const ICONS = {
            play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>',
            pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z"/></svg>',
            replay: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1.5L7 6.5l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>',
            subtitle:
                '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm2 8v2h8v-2zm10 0v2h2v-2zM6 10v2h2v-2zm4 0v2h8v-2z"/></svg>',
            enterFullscreen:
                '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM6 15v3h3v2H4v-5zm14 0v5h-5v-2h3v-3z"/></svg>',
            exitFullscreen:
                '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4V7h3V4zm6 0h2v3h3v2h-5zM4 15h5v5H7v-3H4zm11 0h5v2h-3v3h-2z"/></svg>',
        };

        function formatClock(seconds) {
            const wholeSeconds = Math.max(0, Math.floor(seconds));
            const minutes = Math.floor(wholeSeconds / 60);
            return `${minutes}:${String(wholeSeconds % 60).padStart(2, "0")}`;
        }

        function findSlideAt(seconds) {
            const { slides } = timeline;
            for (let index = slides.length - 1; index >= 0; index -= 1) {
                if (seconds >= slides[index].startSeconds) return slides[index];
            }
            return slides[0];
        }

        function findLineTextAt(slide, seconds) {
            const line = slide.lines.find(
                (candidate) => seconds >= candidate.startSeconds && seconds < candidate.endSeconds + SUBTITLE_LINGER_SECONDS,
            );
            return line ? line.text : "";
        }

        function measureMotionElapsedByName(slide, seconds) {
            const elapsedByName = {};
            for (const motion of slide.motions) {
                const elapsedSeconds = seconds - motion.startSeconds;
                if (elapsedSeconds < 0) {
                    elapsedByName[motion.name] = null;
                } else if (motion.durationSeconds === null) {
                    elapsedByName[motion.name] = elapsedSeconds;
                } else {
                    elapsedByName[motion.name] = Math.min(elapsedSeconds, motion.durationSeconds);
                }
            }
            return elapsedByName;
        }

        function isPlayerElement(element) {
            return element instanceof Element && element.closest("[data-talkie-ui]") !== null;
        }

        function listDeckAnimations() {
            return document.getAnimations().filter((animation) => !isPlayerElement(animation.effect && animation.effect.target));
        }

        function finishDeckAnimations() {
            if (adapter.ownsDocumentAnimations) return;
            for (const animation of listDeckAnimations()) {
                const { endTime, iterations } = animation.effect.getComputedTiming();
                if (Number.isFinite(endTime) && Number.isFinite(iterations)) animation.finish();
            }
        }

        function syncDeckAnimations(isClockRunning, playbackRate) {
            if (adapter.ownsDocumentAnimations) return;
            for (const animation of listDeckAnimations()) {
                if (animation.playbackRate !== playbackRate) animation.updatePlaybackRate(playbackRate);
                if (isClockRunning && animation.playState === "paused") animation.play();
                if (!isClockRunning && animation.playState === "running") animation.pause();
            }
        }

        const audio = new Audio();
        audio.preload = "auto";
        audio.preservesPitch = true;

        const root = document.createElement("div");
        root.className = "talkie-ui";
        root.dataset.talkieUi = "";
        root.innerHTML = `
            <div class="talkie-subtitle" aria-live="off"></div>
            <div class="talkie-bar">
                <div class="talkie-scrubber" role="slider" tabindex="0" aria-label="재생 위치">
                    <div class="talkie-tooltip"></div>
                    <div class="talkie-thumb"></div>
                </div>
                <div class="talkie-row">
                    <button type="button" class="talkie-button" data-action="toggle" aria-label="재생"></button>
                    <span class="talkie-time"></span>
                    <span class="talkie-chapter-title"></span>
                    <span class="talkie-spacer"></span>
                    <button type="button" class="talkie-button" data-action="subtitle" aria-label="자막" aria-pressed="true">${ICONS.subtitle}</button>
                    <div class="talkie-rate">
                        <button type="button" class="talkie-button" data-action="rate" aria-label="재생 속도" aria-haspopup="menu">1x</button>
                        <div class="talkie-rate-menu" role="menu"></div>
                    </div>
                    <button type="button" class="talkie-button" data-action="fullscreen" aria-label="전체화면">${ICONS.enterFullscreen}</button>
                </div>
            </div>
            <div class="talkie-overlay">
                <button type="button" disabled>${ICONS.play}<span>불러오는 중</span></button>
                <p class="talkie-keyboard-hint"><kbd>Space</kbd> 재생 · <kbd>← →</kbd> 슬라이드 이동 · <kbd>J L</kbd> 10초 이동 · <kbd>C</kbd> 자막 · <kbd>F</kbd> 전체화면</p>
            </div>`;
        document.body.append(root);

        const subtitleElement = root.querySelector(".talkie-subtitle");
        const scrubber = root.querySelector(".talkie-scrubber");
        const tooltip = root.querySelector(".talkie-tooltip");
        const thumb = root.querySelector(".talkie-thumb");
        const toggleButton = root.querySelector('[data-action="toggle"]');
        const subtitleButton = root.querySelector('[data-action="subtitle"]');
        const rateButton = root.querySelector('[data-action="rate"]');
        const rateMenu = root.querySelector(".talkie-rate-menu");
        const fullscreenButton = root.querySelector('[data-action="fullscreen"]');
        const timeLabel = root.querySelector(".talkie-time");
        const chapterTitle = root.querySelector(".talkie-chapter-title");
        const overlay = root.querySelector(".talkie-overlay");
        const overlayButton = overlay.querySelector("button");
        const barElement = root.querySelector(".talkie-bar");
        const hoverCapability = window.matchMedia("(hover: hover)");

        fullscreenButton.hidden = !document.documentElement.requestFullscreen;

        if (data.accentColor) document.documentElement.style.setProperty("--talkie-accent", data.accentColor);

        const chapterElements = timeline.slides.map((slide) => {
            const chapter = document.createElement("div");
            chapter.className = "talkie-chapter";
            chapter.style.setProperty("--talkie-chapter-grow", String(slide.endSeconds - slide.startSeconds));
            chapter.innerHTML = "<i></i>";
            scrubber.insertBefore(chapter, tooltip);
            return chapter;
        });

        for (const playbackRate of PLAYBACK_RATES) {
            const option = document.createElement("button");
            option.type = "button";
            option.className = "talkie-button";
            option.setAttribute("role", "menuitemradio");
            option.setAttribute("aria-checked", String(playbackRate === 1));
            option.dataset.rate = String(playbackRate);
            option.textContent = `${playbackRate}x`;
            rateMenu.append(option);
        }

        const playerMachine = XState.setup({
            actions: {
                playAudio: () => {
                    audio.play().catch(() => actor.send({ type: "PLAY_BLOCKED" }));
                },
                pauseAudio: () => audio.pause(),
                rewind: () => {
                    audio.currentTime = 0;
                },
                rememberPlaying: XState.assign({ resumeAfterSeek: true }),
                rememberStopped: XState.assign({ resumeAfterSeek: false }),
            },
            guards: {
                shouldResumeAfterSeek: ({ context }) => context.resumeAfterSeek,
            },
        }).createMachine({
            id: "talkiePlayer",
            initial: "loading",
            context: { resumeAfterSeek: false },
            states: {
                loading: {
                    on: { AUDIO_READY: "ready", AUDIO_FAILED: "failed" },
                },
                failed: {},
                ready: {
                    on: {
                        PLAY: "playing",
                        TOGGLE: "playing",
                        SEEK_START: { target: "seeking", actions: "rememberStopped" },
                    },
                },
                playing: {
                    entry: "playAudio",
                    on: {
                        PAUSE: "paused",
                        TOGGLE: "paused",
                        PLAY_BLOCKED: "paused",
                        WAITING: "buffering",
                        ENDED: "ended",
                        SEEK_START: { target: "seeking", actions: "rememberPlaying" },
                    },
                },
                buffering: {
                    on: {
                        RESUMED: "playing",
                        PAUSE: "paused",
                        TOGGLE: "paused",
                        ENDED: "ended",
                        SEEK_START: { target: "seeking", actions: "rememberPlaying" },
                    },
                },
                paused: {
                    entry: "pauseAudio",
                    on: {
                        PLAY: "playing",
                        TOGGLE: "playing",
                        SEEK_START: { target: "seeking", actions: "rememberStopped" },
                    },
                },
                seeking: {
                    entry: "pauseAudio",
                    on: {
                        SEEK_COMMIT: [{ guard: "shouldResumeAfterSeek", target: "playing" }, { target: "paused" }],
                    },
                },
                ended: {
                    on: {
                        PLAY: { target: "playing", actions: "rewind" },
                        TOGGLE: { target: "playing", actions: "rewind" },
                        SEEK_START: { target: "seeking", actions: "rememberStopped" },
                    },
                },
            },
        });

        const actor = XState.createActor(playerMachine);

        let shownSlideIndex = -1;
        let lastRenderedSeconds = 0;
        let lastScrubberSlideIndex = -1;
        let playbackRate = 1;
        let isSubtitleEnabled = true;
        let isDiscontinuityPending = true;
        let idleTimerId = 0;

        function renderAt(seconds) {
            const isDiscontinuous = isDiscontinuityPending || Math.abs(seconds - lastRenderedSeconds) > DISCONTINUITY_SECONDS;
            const slide = findSlideAt(seconds);
            const isRunning = actor.getSnapshot().matches("playing");

            if (slide.slideIndex !== shownSlideIndex) {
                adapter.showSlide(slide.slideIndex, {
                    isDiscontinuous: isDiscontinuous || slide.slideIndex !== shownSlideIndex + 1,
                });
                shownSlideIndex = slide.slideIndex;
            }
            adapter.seekMotion(slide.slideIndex, measureMotionElapsedByName(slide, seconds), {
                isDiscontinuous,
                localSeconds: seconds - slide.startSeconds,
            });

            if (isDiscontinuous) finishDeckAnimations();
            syncDeckAnimations(isRunning, playbackRate);

            renderSubtitle(slide, seconds);
            renderScrubber(slide, seconds);

            isDiscontinuityPending = false;
            lastRenderedSeconds = seconds;
        }

        function renderSubtitle(slide, seconds) {
            const text = isSubtitleEnabled ? findLineTextAt(slide, seconds) : "";
            if (subtitleElement.textContent !== text && text !== "") subtitleElement.textContent = text;
            subtitleElement.toggleAttribute("data-visible", text !== "");
        }

        function renderScrubber(slide, seconds) {
            if (slide.slideIndex !== lastScrubberSlideIndex) {
                chapterElements.forEach((chapter, index) => {
                    chapter.style.setProperty("--talkie-chapter-progress", index < slide.slideIndex ? "1" : "0");
                });
                chapterTitle.textContent = `${slide.slideIndex + 1}. ${slide.title}`;
                lastScrubberSlideIndex = slide.slideIndex;
            }
            const chapterProgress = (seconds - slide.startSeconds) / (slide.endSeconds - slide.startSeconds);
            chapterElements[slide.slideIndex].style.setProperty("--talkie-chapter-progress", String(chapterProgress));

            const chapterRect = chapterElements[slide.slideIndex].getBoundingClientRect();
            const scrubberRect = scrubber.getBoundingClientRect();
            thumb.style.left = `${chapterRect.left - scrubberRect.left + chapterRect.width * chapterProgress}px`;

            timeLabel.textContent = `${formatClock(seconds)} / ${formatClock(timeline.durationSeconds)}`;
            scrubber.setAttribute("aria-valuemin", "0");
            scrubber.setAttribute("aria-valuemax", String(Math.round(timeline.durationSeconds)));
            scrubber.setAttribute("aria-valuenow", String(Math.round(seconds)));
            scrubber.setAttribute("aria-valuetext", `${formatClock(seconds)}, ${slide.slideIndex + 1}번 슬라이드 ${slide.title}`);
        }

        function runFrame() {
            const snapshot = actor.getSnapshot();
            if (snapshot.matches("playing") || snapshot.matches("buffering") || snapshot.matches("seeking")) {
                renderAt(audio.currentTime);
            }
            requestAnimationFrame(runFrame);
        }

        function seekTo(seconds) {
            audio.currentTime = Math.min(Math.max(0, seconds), timeline.durationSeconds);
            isDiscontinuityPending = true;
        }

        function jumpTo(seconds) {
            actor.send({ type: "SEEK_START" });
            seekTo(seconds);
            renderAt(audio.currentTime);
            actor.send({ type: "SEEK_COMMIT" });
            renderAt(audio.currentTime);
        }

        function jumpBySlide(delta) {
            const slide = findSlideAt(audio.currentTime);
            const targetIndex = Math.min(Math.max(0, slide.slideIndex + delta), timeline.slides.length - 1);
            jumpTo(timeline.slides[targetIndex].startSeconds);
        }

        function secondsFromPointer(clientX) {
            for (const [index, chapter] of chapterElements.entries()) {
                const rect = chapter.getBoundingClientRect();
                if (clientX <= rect.right || index === chapterElements.length - 1) {
                    const slide = timeline.slides[index];
                    const ratio = Math.min(Math.max(0, (clientX - rect.left) / rect.width), 1);
                    return slide.startSeconds + ratio * (slide.endSeconds - slide.startSeconds);
                }
            }
            return 0;
        }

        function showTooltip(clientX) {
            const seconds = secondsFromPointer(clientX);
            const slide = findSlideAt(seconds);
            const rect = scrubber.getBoundingClientRect();
            tooltip.textContent = `${formatClock(seconds)} · ${slide.slideIndex + 1}. ${slide.title}`;
            const halfWidth = tooltip.offsetWidth / 2;
            tooltip.style.left = `${Math.min(Math.max(halfWidth, clientX - rect.left), rect.width - halfWidth)}px`;
            tooltip.toggleAttribute("data-visible", true);
        }

        function setPlaybackRate(nextRate) {
            playbackRate = nextRate;
            audio.playbackRate = nextRate;
            rateButton.textContent = `${nextRate}x`;
            for (const option of rateMenu.children) {
                option.setAttribute("aria-checked", String(Number(option.dataset.rate) === nextRate));
            }
        }

        function toggleSubtitle() {
            isSubtitleEnabled = !isSubtitleEnabled;
            subtitleButton.setAttribute("aria-pressed", String(isSubtitleEnabled));
            renderSubtitle(findSlideAt(audio.currentTime), audio.currentTime);
        }

        function toggleFullscreen() {
            if (document.fullscreenElement) {
                document.exitFullscreen();
                return;
            }
            if (!document.documentElement.requestFullscreen) return;
            // 16:9 덱은 세로 휴대폰에서 화면의 4분의 1만 차지합니다. 방향 고정을 거절하는 기기가 있어도 전체화면은 유지합니다.
            document.documentElement
                .requestFullscreen()
                .then(() => screen.orientation?.lock?.("landscape"))
                .catch(() => {});
        }

        function start() {
            document.documentElement.toggleAttribute("data-talkie-started", true);
            overlay.hidden = true;
            actor.send({ type: "PLAY" });
        }

        function revealControls() {
            const rootElement = document.documentElement;
            rootElement.toggleAttribute("data-talkie-controls", true);
            rootElement.removeAttribute("data-talkie-idle");
            clearTimeout(idleTimerId);
            idleTimerId = setTimeout(hideControlsWhenIdle, CONTROLS_IDLE_MS);
        }

        function hideControls() {
            clearTimeout(idleTimerId);
            document.documentElement.removeAttribute("data-talkie-controls");
            document.documentElement.toggleAttribute("data-talkie-idle", true);
        }

        function hideControlsWhenIdle() {
            // 터치 기기는 손을 뗀 뒤에도 :hover 가 남아서 컨트롤이 영영 사라지지 않습니다.
            const isHoveringBar = hoverCapability.matches && barElement.matches(":hover");
            if (!actor.getSnapshot().matches("playing") || isHoveringBar || isDraggingScrubber || rateMenu.hasAttribute("data-open")) return;
            hideControls();
        }

        function toggleControlsByTap() {
            const isControlsVisible = document.documentElement.hasAttribute("data-talkie-controls");
            if (isControlsVisible && actor.getSnapshot().matches("playing")) hideControls();
            else revealControls();
        }

        function liftSubtitleAboveBar() {
            const subtitleBottomPixels = parseFloat(getComputedStyle(subtitleElement).bottom) || 0;
            const liftPixels = Math.max(0, barElement.offsetHeight + 8 - subtitleBottomPixels);
            document.documentElement.style.setProperty("--talkie-subtitle-lift", `${liftPixels}px`);
        }

        function renderToggleButton(snapshot) {
            const isEnded = snapshot.matches("ended");
            const isPlayingLike = snapshot.matches("playing") || snapshot.matches("buffering");
            toggleButton.innerHTML = isEnded ? ICONS.replay : isPlayingLike ? ICONS.pause : ICONS.play;
            toggleButton.setAttribute("aria-label", isEnded ? "처음부터 재생" : isPlayingLike ? "일시정지" : "재생");
        }

        actor.subscribe((snapshot) => {
            renderToggleButton(snapshot);
            if (snapshot.matches("ready")) {
                overlayButton.disabled = false;
                overlayButton.querySelector("span").textContent = "발표 시작";
            }
            if (snapshot.matches("failed")) {
                overlayButton.querySelector("span").textContent = "오디오를 불러오지 못했습니다";
            }
            if (!snapshot.matches("playing")) revealControls();
            if (snapshot.matches("paused") || snapshot.matches("ended") || snapshot.matches("playing")) {
                renderAt(audio.currentTime);
            }
        });
        actor.start();

        audio.addEventListener("loadedmetadata", () => actor.send({ type: "AUDIO_READY" }));
        audio.addEventListener("error", () => {
            // 샌드박스 iframe 처럼 blob 재생이 막힌 곳에서는 data URI 로 한 번 더 시도합니다.
            if (data.audioBase64 && audio.src.startsWith("blob:")) {
                audio.src = `data:audio/mpeg;base64,${data.audioBase64}`;
                return;
            }
            actor.send({ type: "AUDIO_FAILED" });
        });
        audio.addEventListener("waiting", () => actor.send({ type: "WAITING" }));
        audio.addEventListener("playing", () => actor.send({ type: "RESUMED" }));
        audio.addEventListener("ended", () => actor.send({ type: "ENDED" }));

        let isDraggingScrubber = false;
        scrubber.addEventListener("pointerdown", (event) => {
            isDraggingScrubber = true;
            scrubber.setPointerCapture(event.pointerId);
            scrubber.toggleAttribute("data-dragging", true);
            actor.send({ type: "SEEK_START" });
            seekTo(secondsFromPointer(event.clientX));
            showTooltip(event.clientX);
            revealControls();
        });
        scrubber.addEventListener("pointermove", (event) => {
            showTooltip(event.clientX);
            if (isDraggingScrubber) seekTo(secondsFromPointer(event.clientX));
        });
        scrubber.addEventListener("pointerleave", () => {
            if (!isDraggingScrubber) tooltip.removeAttribute("data-visible");
        });
        const finishScrubberDrag = () => {
            if (!isDraggingScrubber) return;
            isDraggingScrubber = false;
            scrubber.removeAttribute("data-dragging");
            tooltip.removeAttribute("data-visible");
            actor.send({ type: "SEEK_COMMIT" });
        };
        scrubber.addEventListener("pointerup", finishScrubberDrag);
        scrubber.addEventListener("pointercancel", finishScrubberDrag);

        toggleButton.addEventListener("click", () => actor.send({ type: "TOGGLE" }));
        subtitleButton.addEventListener("click", toggleSubtitle);
        fullscreenButton.addEventListener("click", toggleFullscreen);
        overlayButton.addEventListener("click", start);
        rateButton.addEventListener("click", () => rateMenu.toggleAttribute("data-open"));
        rateMenu.addEventListener("click", (event) => {
            const option = event.target.closest("[data-rate]");
            if (!option) return;
            setPlaybackRate(Number(option.dataset.rate));
            rateMenu.removeAttribute("data-open");
        });

        document.addEventListener("fullscreenchange", () => {
            fullscreenButton.innerHTML = document.fullscreenElement ? ICONS.exitFullscreen : ICONS.enterFullscreen;
        });

        window.addEventListener(
            "pointermove",
            (event) => {
                if (event.pointerType !== "touch") revealControls();
            },
            { passive: true },
        );
        barElement.addEventListener("pointerdown", revealControls, { passive: true });

        let lastPointerType = "mouse";
        window.addEventListener(
            "pointerdown",
            (event) => {
                lastPointerType = event.pointerType;
            },
            { capture: true, passive: true },
        );

        document.addEventListener("click", (event) => {
            if (isPlayerElement(event.target)) return;
            const interactiveSelector = ["a", "button", "input", "select", "textarea", "label", "summary", "dialog", adapter.interactiveSelector]
                .filter(Boolean)
                .join(",");
            if (event.target instanceof Element && event.target.closest(interactiveSelector)) return;
            if (rateMenu.hasAttribute("data-open")) {
                rateMenu.removeAttribute("data-open");
                return;
            }
            if (actor.getSnapshot().matches("ready")) return;
            // 터치는 컨트롤을 보이는 수단이 탭뿐입니다. 탭이 일시정지가 되면 재생 중에 재생바를 볼 수 없습니다.
            if (lastPointerType === "touch") toggleControlsByTap();
            else actor.send({ type: "TOGGLE" });
        });

        new ResizeObserver(liftSubtitleAboveBar).observe(barElement);
        window.addEventListener("resize", () => {
            liftSubtitleAboveBar();
            renderAt(audio.currentTime);
        });

        // 덱의 스와이프 핸들러가 재생 시계를 건너뛰고 슬라이드를 바꾸지 못하게 막습니다.
        for (const touchEventName of ["touchstart", "touchend"]) {
            window.addEventListener(
                touchEventName,
                (event) => {
                    if (!isPlayerElement(event.target)) event.stopPropagation();
                },
                { capture: true, passive: true },
            );
        }

        const KEY_HANDLERS = {
            " ": () => (actor.getSnapshot().matches("ready") ? start() : actor.send({ type: "TOGGLE" })),
            k: () => actor.send({ type: "TOGGLE" }),
            arrowleft: () => jumpBySlide(-1),
            pageup: () => jumpBySlide(-1),
            arrowright: () => jumpBySlide(1),
            pagedown: () => jumpBySlide(1),
            j: () => jumpTo(audio.currentTime - SEEK_STEP_SECONDS),
            l: () => jumpTo(audio.currentTime + SEEK_STEP_SECONDS),
            home: () => jumpTo(0),
            end: () => jumpTo(timeline.durationSeconds - 0.05),
            c: toggleSubtitle,
            f: toggleFullscreen,
        };

        window.addEventListener(
            "keydown",
            (event) => {
                if (event.metaKey || event.ctrlKey || event.altKey) return;
                if (document.querySelector("dialog[open]")) return;
                if (event.target instanceof Element && event.target.closest("input,textarea,select,[contenteditable]")) return;
                if (event.key === " " && event.target instanceof Element && event.target.closest("button,a")) {
                    event.stopImmediatePropagation();
                    return;
                }
                const handler = KEY_HANDLERS[event.key.toLowerCase()];
                if (!handler) return;
                event.preventDefault();
                event.stopImmediatePropagation();
                handler();
                revealControls();
            },
            true,
        );

        function decodeBase64ToBlobUrl(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
            return URL.createObjectURL(new Blob([bytes], { type: "audio/mpeg" }));
        }

        /**
         * 호스팅 환경이 Range 요청을 지원하지 않으면 큰 파일의 탐색이 끊길 수 있어서,
         * 받을 수 있으면 통째로 받아 blob URL 로 재생합니다.
         */
        async function loadAudio() {
            if (data.audioBase64) {
                audio.src = decodeBase64ToBlobUrl(data.audioBase64);
                return;
            }
            try {
                const response = await fetch(data.audioUrl);
                if (!response.ok) throw new Error(String(response.status));
                audio.src = URL.createObjectURL(await response.blob());
            } catch {
                audio.src = data.audioUrl;
            }
        }

        /** inspect_seek.py 가 재생과 탐색 결과를 비교할 때 쓰는 검사 전용 진입점입니다. */
        window.__talkie = {
            getState: () => actor.getSnapshot().value,
            getSeconds: () => audio.currentTime,
            getAudioDurationSeconds: () => audio.duration,
            getShownSlideIndex: () => shownSlideIndex,
            start,
            pause: () => actor.send({ type: "PAUSE" }),
            jumpTo,
            finishAnimations: finishDeckAnimations,
            playUntil: (targetSeconds, leadSeconds) =>
                new Promise((resolve) => {
                    jumpTo(Math.max(0, targetSeconds - leadSeconds));
                    actor.send({ type: "PLAY" });
                    const poll = () => {
                        if (audio.currentTime < targetSeconds) {
                            requestAnimationFrame(poll);
                            return;
                        }
                        actor.send({ type: "PAUSE" });
                        audio.currentTime = targetSeconds;
                        renderAt(targetSeconds);
                        resolve();
                    };
                    poll();
                }),
        };

        adapter.hideSelectors?.forEach((selector) => {
            const style = document.createElement("style");
            style.dataset.talkieUi = "";
            style.textContent = `${selector}{display:none!important}`;
            document.head.append(style);
        });

        adapter.prepare?.();
        renderAt(0);
        requestAnimationFrame(runFrame);
        loadAudio();
    })();
</script>
